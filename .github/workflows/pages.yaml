name: Publish extensions to GitHub Pages

# Lays out bakery releases as a flat tree for systemd-sysupdate:
#   extensions/<ext>/SHA256SUMS + extensions/<ext>/<ext>-<ver>-<arch>.raw
#   extensions/<ext>.conf

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check for new / missing upstream releases and dispatch builds"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EXTENSIONS: "pangolin-cli lldpd doco-cd"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Collect release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for ext in ${EXTENSIONS}; do
            dir="site/extensions/${ext}"
            mkdir -p "${dir}" tmp
            # Aggregate from per-version releases (<ext>-<ver>): each ships
            # its images, a SHA256SUMS and the sysupdate .conf.
            for tag in $(gh release list -R "${GITHUB_REPOSITORY}" --limit 200 --json tagName -q '.[].tagName' | grep -E "^${ext}-"); do
              gh release download "${tag}" -R "${GITHUB_REPOSITORY}" -p '*.raw' -D "${dir}"
              gh release download "${tag}" -R "${GITHUB_REPOSITORY}" -p SHA256SUMS -O - >> "${dir}/SHA256SUMS"
              gh release download "${tag}" -R "${GITHUB_REPOSITORY}" -p '*.conf' -D tmp --clobber
            done
            cp "tmp/${ext}.conf" site/extensions/
          done

          # Browsable indexes: site root (prefix extensions/) and extensions/ (no prefix)
          make_index() {
            local prefix="$1" out="$2"
            {
              echo '<!doctype html><meta charset="utf-8"><title>sysext extensions</title>'
              echo '<h1>sysext extensions</h1><ul>'
              for ext in ${EXTENSIONS}; do
                echo "<li><b>${ext}</b>: <a href=\"${prefix}${ext}.conf\">${ext}.conf</a>, <a href=\"${prefix}${ext}/SHA256SUMS\">SHA256SUMS</a><ul>"
                for raw in "site/extensions/${ext}"/*.raw; do
                  raw="$(basename "${raw}")"
                  echo "<li><a href=\"${prefix}${ext}/${raw}\">${raw}</a></li>"
                done
                echo '</ul></li>'
              done
              echo '</ul>'
            } > "${out}"
          }
          make_index "extensions/" site/index.html
          make_index "" site/extensions/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
